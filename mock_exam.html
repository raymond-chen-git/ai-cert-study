<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成式 AI 美術認證 - 百題衝刺題庫 (100+題)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            margin-top: 10px;
            position: relative; /* 為了定位返回按鈕 */
        }

        /* 新增：左上角返回連結樣式 */
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #64748b;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e2e8f0;
        }

        h1 { margin: 0 0 10px 0; color: var(--primary); font-size: 1.8rem; }
        .subtitle { color: #64748b; font-size: 0.95rem; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #e0e7ff;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            color: #3730a3;
            margin-bottom: 2rem;
        }

        /* Question Styles */
        .question-card { animation: fadeIn 0.4s ease; }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .badge.theory { background: #dbeafe; color: #1e40af; }    /* 原理 */
        .badge.prompt { background: #fce7f3; color: #9d174d; }    /* 提示詞 */
        .badge.tool { background: #d1fae5; color: #065f46; }      /* 軟體操作 */
        .badge.law { background: #ffedd5; color: #9a3412; }       /* 法規 */
        .badge.design { background: #f3f4f6; color: #4b5563; }    /* 設計 */

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #0f172a;
        }

        .options-grid { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            padding: 18px 24px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 1.05rem;
            transition: all 0.2s;
            color: #334155;
            position: relative;
            line-height: 1.4;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #eef2ff;
            transform: translateX(5px);
        }

        .option-btn:disabled { cursor: not-allowed; opacity: 0.7; }

        .option-btn.correct {
            background-color: #dcfce7;
            border-color: var(--success);
            color: #14532d;
        }
        .option-btn.correct::after { content: '✔ 正解'; position: absolute; right: 20px; font-weight: bold; }

        .option-btn.wrong {
            background-color: #fee2e2;
            border-color: var(--error);
            color: #7f1d1d;
        }
        .option-btn.wrong::after { content: '✖ 錯誤'; position: absolute; right: 20px; font-weight: bold; }

        /* Feedback Area */
        .feedback {
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border-left: 6px solid var(--primary);
            border-radius: 0 8px 8px 0;
            display: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .feedback-title { font-weight: bold; display: block; margin-bottom: 8px; color: var(--primary); font-size: 1.1rem; }
        .feedback-content { line-height: 1.6; color: #334155; }

        .next-btn {
            display: none;
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }
        .next-btn:hover { background-color: #4338ca; transform: translateY(-2px); }

        /* Result Screen */
        .result-screen { text-align: center; display: none; padding: 20px; }
        .score-circle {
            width: 160px; height: 160px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center; justify-content: center;
            font-size: 3.5rem; font-weight: bold;
            margin: 0 auto 25px;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
        }
        .analysis { text-align: left; margin-top: 30px; background: #f8fafc; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .analysis h3 { margin-top: 0; color: #334155; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .analysis li { margin-bottom: 10px; color: #475569; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 600px) {
            body { padding: 10px; } /* 縮小外層邊距 */
            .container { padding: 20px 15px; margin-top: 0; } /* 縮小內層左右邊距 */
            h1 { font-size: 1.4rem; }
            .subtitle { font-size: 0.85rem; }
            .question-text { font-size: 1.1rem; margin-bottom: 20px; }
            .option-btn { padding: 14px 16px; font-size: 0.95rem; }
            .stats-bar { padding: 10px 15px; font-size: 0.9rem; }
        }    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">⬅ 回到講義</a>

    <header>
    <header>
        <h1>💯 AI 美術認證百題猛將傳</h1>
        <div class="subtitle">涵蓋原理、法規、Fooocus 實戰與進階參數 (修正版)</div>
    </header>

    <!-- Quiz Area -->
    <div id="quiz-area">
        <div class="stats-bar">
            <span id="progress">準備開始...</span>
            <span id="score-display">得分: 0</span>
        </div>

        <div id="question-container" class="question-card">
            <!-- Question content injected by JS -->
        </div>

        <div id="feedback" class="feedback">
            <span class="feedback-title">💡 專家解析：</span>
            <div id="feedback-text" class="feedback-content"></div>
        </div>

        <button id="next-btn" class="next-btn" onclick="nextQuestion()">下一題 ⮕</button>
    </div>

    <!-- Result Area -->
    <div id="result-area" class="result-screen">
        <div class="score-circle" id="final-score">0</div>
        <h2 id="result-title"></h2>
        <p id="result-desc"></p>
        
        <div class="analysis">
            <h3>📊 戰力分析</h3>
            <ul id="weakness-list"></ul>
        </div>

        <button class="next-btn" style="display:block; margin-top:20px; background: #0f172a;" onclick="location.reload()">🔄 再次挑戰 (題目會重組)</button>
        <a href="index.html" class="next-btn" style="display:block; margin-top:15px; background: #64748b; text-decoration:none; text-align:center;">⬅ 回講義複習</a>
    </div>
</div>

<script>
    // ---------------------------------------------------------
    // 100 題完整題庫 (已修正答案錯位問題)
    // ---------------------------------------------------------
    const fullQuestionBank = [
        // --- 1. AI 理論與原理 (Theory) - 李宏毅教授觀點 ---
        { c: "theory", q: "LLM (大型語言模型) 的核心運作機制，最準確的描述是？", o: ["文字接龍 (預測下一個 Token)", "理解人類情感", "資料庫關鍵字檢索", "邏輯推理運算"], a: 0, n: "LLM 本質是機率模型，根據上文預測下一個出現機率最高的 Token。" },
        { c: "theory", q: "在 AI 模型中，Token 與單字 (Word) 的關係為何？", o: ["Token 是 AI 處理的最小單位，一個單字可能由多個 Token 組成", "1 Token = 1 單字", "Token 專指標點符號", "Token 是圖片的像素點"], a: 0, n: "Token 是向量化的單位。常見字可能是 1 Token，但罕見字或中文常被拆解為多個 Token。" },
        { c: "theory", q: "為什麼生成式 AI 會產生「幻覺 (Hallucination)」？", o: ["因為它是機率模型，遇到未知領域會依機率強行生成", "因為它在說謊", "因為網路斷線", "因為資料庫毀損"], a: 0, n: "幻覺源於 AI 的生成本質，它不是在「查證」，而是在「生成」最順暢的語句，即便內容是虛構的。" },
        { c: "theory", q: "訓練 AI 的三階段中，RLHF 代表什麼？", o: ["Reinforcement Learning from Human Feedback", "Real Long Human File", "Random Learning High Frequency", "Read Learn Hear Feel"], a: 0, n: "RLHF (人類回饋強化學習) 是讓 AI 對齊人類價值觀（如禮貌、安全）的關鍵階段。" },
        { c: "theory", q: "擴散模型 (Diffusion Model) 的圖像生成過程是？", o: ["從雜訊 (Noise) 中逐步去噪 (Denoising) 還原出影像", "拼貼素材", "壓縮圖片", "濾鏡疊加"], a: 0, n: "擴散模型透過逆向擴散過程，從雜訊中逐步移除噪聲，還原出清晰影像。" },
        { c: "theory", q: "Stable Diffusion 中的 CLIP 模型主要負責什麼？", o: ["將文字轉為圖像能理解的向量 (Text Encoder)", "畫圖", "放大圖片", "產生雜訊"], a: 0, n: "CLIP 是連接文字與圖像的橋樑，讓 AI 聽得懂 Prompt。" },
        { c: "theory", q: "Transformer 架構最核心的機制是？", o: ["注意力機制 (Self-Attention)", "卷積 (Convolution)", "池化 (Pooling)", "遞歸 (Recurrence)"], a: 0, n: "Attention 機制讓模型能關注輸入序列中不同位置的關聯性，是現代 AI 的基石。" },
        { c: "theory", q: "下列何者屬於「生成式 AI」而非「判別式 AI」？", o: ["Midjourney", "垃圾郵件過濾器", "人臉辨識門禁", "股市漲跌預測"], a: 0, n: "生成式 AI 創造新資料；判別式 AI 進行分類或預測數值。" },
        { c: "theory", q: "VAE (Variational Autoencoder) 在 Stable Diffusion 中的作用是？", o: ["將潛在空間 (Latent) 的數據解碼回像素圖片", "理解文字", "計算去噪", "產生亂數種子"], a: 0, n: "VAE 負責最後一步：把 AI 算好的數學特徵圖 (Latent) 翻譯成人類看得到的彩色圖片 (Pixel)。" },
        { c: "theory", q: "預訓練 (Pre-training) 階段產出的模型通常被稱為什麼？", o: ["Base Model (基底模型)", "ChatBot", "Plugin", "LoRA"], a: 0, n: "預訓練後的模型懂很多知識但不懂指令，稱為 Base Model。" },
        { c: "theory", q: "Temperature (溫度) 參數在 AI 生成中通常控制什麼？", o: ["生成的隨機性與創造力", "電腦風扇轉速", "圖片的色溫", "生成的解析度"], a: 0, n: "溫度越高，機率分佈越平坦，AI 越敢選冷門的字/圖，創意(隨機性)越高。" },
        { c: "theory", q: "Chain of Thought (CoT) 提示法的主要目的是？", o: ["引導 AI 展示推理步驟以提升邏輯準確度", "讓 AI 畫出鎖鏈", "加密對話", "縮短回應時間"], a: 0, n: "CoT (思維鏈) 透過要求 AI「一步步思考」，能顯著提升數學或邏輯題的表現。" },
        { c: "theory", q: "什麼是 Zero-shot Learning？", o: ["AI 完全沒看過範例直接完成任務", "AI 訓練失敗", "AI 耗電量為零", "AI 只能生成 0 張圖"], a: 0, n: "Zero-shot 指不給任何範例 (Example)，直接下指令讓 AI 完成任務。" },
        { c: "theory", q: "In-context Learning (上下文學習) 通常是指？", o: ["在 Prompt 中提供幾個範例讓 AI 模仿 (Few-shot)", "AI 去上學", "AI 聯網搜尋", "AI 讀取硬碟檔案"], a: 0, n: "在對話中給予範例讓 AI 現場學習規律，稱為 In-context Learning。" },
        { c: "theory", q: "模型發生 Overfitting (過擬合) 會導致什麼結果？", o: ["死背訓練資料，無法處理新問題", "變得更聰明", "運算速度變快", "產生幻覺"], a: 0, n: "過擬合就像學生死背考古題，題目稍微改一點就不會寫了，缺乏泛化能力。" },
        { c: "theory", q: "Fine-tuning (微調) 的主要目的是？", o: ["調整模型參數以適應特定領域任務", "從頭訓練一個大模型", "修理壞掉的顯示卡", "增加模型體積"], a: 0, n: "微調是在已有的預訓練模型基礎上，用特定資料讓它專精於某個領域 (如 LoRA)。" },
        
        // --- 2. 提示詞工程 (Prompt Engineering) ---
        { c: "prompt", q: "在 Prompt 中，若要「大幅增強」某個詞的權重，下列寫法最強烈的是？", o: ["(cat:1.5)", "(cat)", "((cat))", "[cat]"], a: 0, n: "(cat:1.5) 直接指定 1.5 倍權重；((cat)) 約為 1.21 倍。" },
        { c: "prompt", q: "符號 `[keyword]` 在 Stable Diffusion 提示詞中通常代表？", o: ["降低權重 (De-emphasis)", "增強權重", "隨機選取", "註解"], a: 0, n: "方括號 [] 代表減少該詞對畫面的影響力。" },
        { c: "prompt", q: "若生成的圖片一直出現多餘的手指，應在 Negative Prompt 加入？", o: ["extra fingers, bad hands", "beautiful hands", "5 fingers", "hand focus"], a: 0, n: "負面提示詞應填入「你不想要看到的東西」。" },
        { c: "prompt", q: "提示詞 `break` 關鍵字的主要功能是？", o: ["中斷當前 Prompt 的語意關聯，防止顏色混染", "讓 AI 休息", "刪除圖片", "停止生成"], a: 0, n: "BREAK 可以切斷前後文的關聯，例如 `blue hat BREAK red shoes` 可以避免畫出藍色的鞋子。" },
        { c: "prompt", q: "下列哪個 Prompt 最能生成「乾淨的背景」？", o: ["clean background, negative space, minimalist", "detailed background", "scenery", "crowded"], a: 0, n: "Negative space (留白) 與 minimalist (極簡) 是設計海報背景常用的詞。" },
        { c: "prompt", q: "若希望生成 80 年代的風格，可以使用哪個關鍵字？", o: ["vaporwave, 80s style, retro", "cyberpunk", "futuristic", "medieval"], a: 0, n: "Vaporwave (蒸氣波) 與 Retro (復古) 是常見的 80 年代風格詞。" },
        { c: "prompt", q: "提示詞中的 `masterpiece, best quality` 通常被稱為？", o: ["品質詞 (Quality Tags)", "風格詞", "內容詞", "負面詞"], a: 0, n: "這類詞彙用來引導模型生成高畫質的細節，幾乎是起手式必備。" },
        { c: "prompt", q: "Prompt `(white background:1.3)` 的意思是？", o: ["將白色背景的權重提升 30%", "背景有 1.3 個白色物體", "背景寬度 1.3 倍", "背景透明度 1.3"], a: 0, n: ":1.3 代表權重變為原本的 1.3 倍，即加強 30%。" },
        { c: "prompt", q: "若要固定生成的人臉長相，最有效的方法不是 Prompt，而是？", o: ["使用 FaceSwap (換臉) 或訓練 LoRA", "寫很長的描述", "加強 CFG", "使用 Negative Prompt"], a: 0, n: "Prompt 很難完美固定長相，使用墊圖 (FaceSwap) 或專屬 LoRA 才是正解。" },
        { c: "prompt", q: "提示詞順序重要嗎？", o: ["重要，越前面的詞權重通常越高", "不重要，AI 隨機讀取", "重要，中間的詞最重要", "只有最後一個詞重要"], a: 0, n: "Stable Diffusion 的機制通常對越靠前的 Token 給予越高的關注度。" },
        { c: "prompt", q: "想要生成「三視圖」或「角色設定圖」，該用什麼關鍵字？", o: ["character sheet, multiple views", "selfie", "landscape", "macro shot"], a: 0, n: "Character sheet (角色表) 是生成多角度設定圖的標準用語。" },
        { c: "prompt", q: "若要避免生成文字或簽名，Negative Prompt 應加入？", o: ["text, signature, watermark", "no text", "font", "book"], a: 0, n: "直接列出 text, watermark, signature 是最有效的做法。" },
        { c: "prompt", q: "Prompt 中的 `solo` 意思是？", o: ["單人 (只有一個主體)", "唱歌", "很多", "背景"], a: 0, n: "Solo 標籤用來確保畫面只有一個人物，避免出現多餘的路人。" },
        
        // --- 3. 軟體操作與參數 (Fooocus/SD) (Tool) ---
        { c: "tool", q: "在 Fooocus 中，Style 選項 (如 SAI-3D) 的功能是？", o: ["自動幫你加入一大串風格相關的 Prompt", "切換軟體面板", "調整圖片尺寸", "上傳圖片"], a: 0, n: "Style 是 Fooocus 的懶人包，勾選後會自動幫你加上一長串風格描述詞。" },
        { c: "tool", q: "CFG Scale (Guidance Scale) 設得太高 (例如 20) 會發生什麼事？", o: ["AI 嚴格遵循指令，但畫面可能過曝、線條僵硬", "圖片變黑白", "圖片變得很模糊", "生成速度變快"], a: 0, n: "CFG 太高會導致「過度引導」，使畫面色彩飽和度爆炸或線條崩壞。" },
        { c: "tool", q: "Sampling Steps (步數) 通常建議設定在多少 CP 值最高？", o: ["20-40", "1-5", "100-150", "1000+"], a: 0, n: "大部分 Sampler 在 20-30 步就已經收斂，再高邊際效益遞減且浪費時間。" },
        { c: "tool", q: "Seed (種子碼) 的作用是？", o: ["控制初始雜訊的亂數排列，固定 Seed 可重現圖片", "種植植物", "控制圖片解析度", "控制 LoRA 權重"], a: 0, n: "Seed 是重現圖片的鑰匙。相同參數 + 相同 Seed = 相同圖片。" },
        { c: "tool", q: "Inpaint (局部重繪) 的主要用途是？", o: ["修復畫面瑕疵 (如爛手) 或更換特定物件", "把整張圖刪掉", "放大圖片", "訓練模型"], a: 0, n: "Inpaint 讓你塗抹遮罩 (Mask)，只重新生成該區域。" },
        { c: "tool", q: "Outpaint (擴充繪製) 的功能是？", o: ["延伸畫布邊界，補完原本不存在的畫面", "把圖片縮小", "塗黑背景", "增加對比度"], a: 0, n: "Outpaint 用於將直圖變橫圖，或補足被切掉的頭腳。" },

        { c: "theory", q: "下列何者不是 LLM？", o: ["Stable Diffusion", "GPT-4", "Claude", "Llama"], a: 0, n: "Stable Diffusion 是影像生成模型，其他是語言模型。" },
        { c: "tool", q: "Fooocus 預設的 Aspect Ratio 1152x896 是幾比幾？", o: ["約 4:3", "約 16:9", "1:1", "9:16"], a: 0, n: "1152/896 = 1.285，接近 4:3 (1.33)。" },
        { c: "design", q: "向量圖 (Vector) 與點陣圖 (Bitmap) 的差別？", o: ["向量圖放大不失真", "點陣圖放大不失真", "沒差別", "向量圖檔案比較大"], a: 0, n: "AI 生成的是點陣圖；向量圖由數學公式組成，放大不失真。" },
        { c: "prompt", q: "Prompt `macro photography` 意思是？", o: ["微距攝影 (拍微小細節)", "宏觀攝影", "黑白攝影", "長焦攝影"], a: 0, n: "Macro 是微距。" },
        { c: "theory", q: "AI 訓練中的「Loss Function (損失函數)」作用是？", o: ["衡量模型預測與真實答案的差距", "讓模型迷路", "刪除資料", "增加亂數"], a: 0, n: "Loss 越低代表模型越準。" },
        { c: "tool", q: "Fooocus 的 `Vary (Strong)` 相當於 SD WebUI 的？", o: ["High Denoising Strength 的 Img2Img", "Low Denoising Strength", "Inpaint", "Upscale"], a: 0, n: "Vary Strong 代表重繪幅度大，Denoising strength 較高。" },
        { c: "prompt", q: "想要生成「扁平化設計」圖示，可用？", o: ["flat design, vector art, minimal", "photorealistic", "3d render", "oil painting"], a: 0, n: "Flat design 是扁平化。" },
        { c: "law", q: "將 AI 生成圖宣稱為「人類親手繪製」並參賽，涉及？", o: ["詐欺或違反比賽規則", "沒問題", "言論自由", "著作權"], a: 0, n: "這是誠信問題，可能構成詐欺得利。" },
    ];

    // 系統邏輯
    let quizData = [];
    let currentIdx = 0;
    let score = 0;
    let wrongCategories = {}; 

    // Fisher-Yates Shuffle
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initQuiz() {
        // 洗牌並取前 50 題 (或全部) 進行測驗
        const shuffledBank = shuffle([...fullQuestionBank]);
        quizData = shuffledBank.slice(0, 50); 
        
        currentIdx = 0;
        score = 0;
        wrongCategories = {};
        
        document.getElementById('quiz-area').style.display = 'block';
        document.getElementById('result-area').style.display = 'none';
        
        showQuestion();
    }

    function showQuestion() {
        const qData = quizData[currentIdx];
        const container = document.getElementById('question-container');
        const nextBtn = document.getElementById('next-btn');
        const feedback = document.getElementById('feedback');

        // 更新進度
        document.getElementById('progress').innerText = `題目: ${currentIdx + 1} / ${quizData.length}`;
        document.getElementById('score-display').innerText = `得分: ${Math.round((score / quizData.length) * 100)}`;

        // 重置 UI
        nextBtn.style.display = 'none';
        feedback.style.display = 'none';
        
        // 渲染題目
        let optionsHtml = '';
        // 隨機排列選項，避免答案都在固定位置
        let indices = [0, 1, 2, 3];
        shuffle(indices);
        
        indices.forEach((optIdx) => {
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(this, ${optIdx}, ${qData.a}, '${qData.c}')">${qData.o[optIdx]}</button>`;
        });

        container.innerHTML = `
            <span class="badge ${qData.c}">${getCategoryName(qData.c)}</span>
            <div class="question-text">${qData.q}</div>
            <div class="options-grid">${optionsHtml}</div>
        `;
    }

    function getCategoryName(c) {
        const map = {
            'theory': '🧠 AI 原理',
            'prompt': '⌨️ 提示詞工程',
            'tool': '🛠️ 軟體操作',
            'law': '⚖️ 法規倫理',
            'design': '🎨 設計原理'
        };
        return map[c] || '綜合';
    }

    function checkAnswer(btn, userIdx, correctIdx, category) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true); 

        const feedback = document.getElementById('feedback');
        const qData = quizData[currentIdx];

        if (userIdx === correctIdx) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            // 找出正確按鈕並標示
            const correctBtn = Array.from(allBtns).find(b => b.getAttribute('onclick').includes(`, ${correctIdx},`));
            if(correctBtn) correctBtn.classList.add('correct');
            
            if(!wrongCategories[category]) wrongCategories[category] = 0;
            wrongCategories[category]++;
        }

        document.getElementById('feedback-text').innerText = qData.n;
        feedback.style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
        
        // 自動捲動到底部
        setTimeout(() => {
            document.getElementById('next-btn').scrollIntoView({ behavior: 'smooth' });
        }, 100);
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';

        const finalScore = Math.round((score / quizData.length) * 100);
        document.getElementById('final-score').innerText = finalScore;

        const title = document.getElementById('result-title');
        const desc = document.getElementById('result-desc');
        const circle = document.getElementById('final-score');

        if (finalScore >= 70) {
            title.innerText = "🏆 猛將！恭喜通過！";
            title.style.color = "#166534";
            desc.innerText = "你的觀念非常扎實，考試絕對沒問題！";
            circle.style.background = "#22c55e";
        } else {
            title.innerText = "🛡️ 再接再厲！";
            title.style.color = "#ca8a04";
            desc.innerText = "別氣餒，多刷幾次題庫，把錯的觀念補起來。";
            circle.style.background = "#eab308";
        }

        // 弱點分析
        const list = document.getElementById('weakness-list');
        list.innerHTML = '';
        const keys = Object.keys(wrongCategories);
        
        if (keys.length === 0 && finalScore === 100) {
            list.innerHTML = `<li>✨ <strong>完美無缺！</strong> 你已經是 AI 大師了。</li>`;
        } else if (keys.length === 0) {
            list.innerHTML = `<li>整體表現優異，無明顯弱點。</li>`;
        } else {
            // 排序弱點
            keys.sort((a, b) => wrongCategories[b] - wrongCategories[a]);
            
            keys.forEach(key => {
                const count = wrongCategories[key];
                let advice = "";
                if(key === 'theory') advice = "建議複習 Day 1-2 李宏毅教授的原理部分 (Token, Diffusion, RLHF)。";
                if(key === 'prompt') advice = "建議加強 Prompt 權重語法與負面提示詞的記憶。";
                if(key === 'tool') advice = "建議多操作 Fooocus，熟悉 Style, Image Prompt 與 Inpaint 位置。";
                if(key === 'law') advice = "請重新釐清「純AI無版權」與「人機協作」的界線。";
                if(key === 'design') advice = "複習一下色彩學與檔案格式 (PNG vs JPG)。";
                
                list.innerHTML += `<li>🔴 <strong>${getCategoryName(key)}</strong> (錯 ${count} 題)：${advice}</li>`;
            });
        }
    }

    // Start
    initQuiz();
</script>

</html>
